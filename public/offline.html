<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#0d0f14"
    />
    <title>LinkDock · Reconnect to your station</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #0d0f14;
        color: #edeef5;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 420px;
        padding: 32px;
        line-height: 1.8;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 30px;
        letter-spacing: -1px;
        line-height: 1.3;
      }
      p {
        color: #a5a8bb;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: 0 20px;
        border-radius: 10px;
        background: #8b8aff;
        color: #10111b;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid white;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="/icon-192.png"
        alt=""
      />
      <h1>Reconnect to your station.</h1>
      <p>LinkDock cannot reach your Pi right now. Check your connection and that the station is running.</p>
      <p>Reconnect to view progress or add downloads. Shared links received offline are not saved or queued.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
